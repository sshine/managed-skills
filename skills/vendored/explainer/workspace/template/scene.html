<!doctype html>
<html>
<head>
<!-- These two come first, in this order, in every scene page. -->
<link rel="stylesheet" href="../../lib/scene.css">
<script src="../../lib/clock.js"></script>
<meta charset="utf-8">
<title>scene-template</title>
<script src="../../lib/anim.js"></script>
<style>
  /* Scene-local styling only; the shared look lives in lib/scene.css. */
</style>
</head>
<body>
<div class="stage">   <!-- a 1920x1080 canvas, scaled to the output resolution -->

  <div class="header hidden0" id="hdr">
    <div class="kicker">explainer · 1/1</div>
    <div class="title">Scene title here</div>
    <div class="rule"></div>
  </div>

  <div class="term hidden0" id="term" style="left:210px; top:300px; width:1500px;">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="tname">~/repo</span>
    </div>
    <div class="line" id="cmd"></div>
    <div class="line out" id="out" style="margin-top:18px">
      <div style="opacity:0">first output line</div>
      <div style="opacity:0">second output line</div>
    </div>
  </div>

  <svg class="wires">
    <path id="wire" class="wire accent" d="M900 740 C 1000 800, 1080 820, 1180 840"/>
  </svg>
  <div class="chip tag hidden0 abs" id="note" style="left:1180px; top:812px;">what it produced</div>

  <div class="caption hidden0" id="cap">One sentence the viewer should <b>leave with</b>.</div>

</div>

<script>
// Build and look up the DOM once, out here. Everything that depends on the
// clock goes inside render, which may be called at any T, in any order, more
// than once, and must set the same state every time — never append, never latch.
(function () {
  const CMD = [
    { t: "cargo ", c: "" },
    { t: "run ", c: "" },
    { t: "--release", c: "flag" },
  ];
  document.getElementById("cmd").dataset.holdCaret = "1";

  window.render = function render() {
    // Helpers take bare element ids: "hdr", never "#hdr".
    enter("hdr", 300);
    enter("term", 900);
    const typed = typeCmd("cmd", CMD, 1200);

    revealLines("out", typed + 400);
    draw("wire", typed + 1200, 700);
    enter("note", typed + 1400);
    fadeIn("cap", typed + 2200);
  };

  window.render();
})();
</script>
</body>
</html>
