# Push and pull-request CI. The real work lives in the two composite actions, so the
# release workflow can reuse the same checks and a local `just ci` cannot drift.
#
# Tags are the release workflow's business; keeping the triggers disjoint stops a tag
# push from running every check twice.
name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Run checks
        uses: ./.github/actions/checks
