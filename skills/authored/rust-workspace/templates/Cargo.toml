[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/example"
# Uncomment when the workspace publishes a library. It is the floor Cargo resolves
# dependencies against, and the value a per-crate linting flavour has to pass on.
# rust-version = "1.85"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dev dependencies
insta = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Internal crates belong here too. A published crate needs a `version` beside its
# `path`, equal to [workspace.package], or `cargo package` refuses to build it.
# Internal crates that are never published can omit the version and have no second
# copy to bump.
# example-core = { version = "0.1.0", path = "crates/example-core" }

[profile.release]
strip = true
lto = "thin"
